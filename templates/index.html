<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Background Remover</title>
    <style>
      :root {
        --bg: #f7f7fb;
        --ink: #1c1b2e;
        --muted: #6b6a80;
        --accent: #5b3df5;
        --line: #dcdbe8;
        --card: #ffffff;
        --check-a: #e9e9f2;
        --check-b: #ffffff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px 16px 64px;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.5;
      }
      main {
        max-width: 860px;
        margin: 0 auto;
      }
      h1 {
        font-size: 2rem;
        margin: 0 0 4px;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 28px;
      }

      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 20px;
      }

      #drop {
        border: 2px dashed var(--line);
        border-radius: 10px;
        padding: 36px 16px;
        text-align: center;
        cursor: pointer;
        color: var(--muted);
      }
      #drop:hover,
      #drop.over {
        border-color: var(--accent);
        color: var(--accent);
      }
      #drop:focus-visible,
      button:focus-visible,
      select:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      #file {
        display: none;
      }

      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: end;
        margin-top: 16px;
      }
      label {
        display: block;
        font-size: 0.9rem;
        color: var(--muted);
        margin-bottom: 4px;
      }
      select {
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font-size: 1rem;
        background: #fff;
        min-width: 240px;
      }
      button {
        padding: 11px 20px;
        border: 0;
        border-radius: 8px;
        font-size: 1rem;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.secondary {
        background: #fff;
        color: var(--accent);
        border: 1px solid var(--accent);
        text-decoration: none;
      }
      a.button {
        display: inline-block;
        padding: 11px 20px;
        border-radius: 8px;
        border: 1px solid var(--accent);
        color: var(--accent);
        text-decoration: none;
        background: #fff;
      }

      #status {
        margin-top: 14px;
        min-height: 1.4em;
        color: var(--muted);
      }
      #status.error {
        color: #b3261e;
      }

      .results {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: 24px;
      }
      .results figure {
        margin: 0;
      }
      figcaption {
        font-size: 0.9rem;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .frame {
        border: 1px solid var(--line);
        border-radius: 10px;
        min-height: 220px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #fff;
      }
      /* checkerboard = transparent background dikhane ke liye */
      .frame.checker {
        background-color: var(--check-b);
        background-image:
          linear-gradient(
            45deg,
            var(--check-a) 25%,
            transparent 25%,
            transparent 75%,
            var(--check-a) 75%
          ),
          linear-gradient(
            45deg,
            var(--check-a) 25%,
            transparent 25%,
            transparent 75%,
            var(--check-a) 75%
          );
        background-size: 20px 20px;
        background-position:
          0 0,
          10px 10px;
      }
      .frame img {
        max-width: 100%;
        max-height: 360px;
        display: block;
      }
      .empty {
        color: var(--muted);
        font-size: 0.9rem;
        padding: 16px;
      }
      #actions {
        margin-top: 16px;
        display: none;
      }

      #actions a.button,
      #actions button {
        font-size: 1rem;
        font-family: inherit;
        line-height: 1.2;
        vertical-align: middle;
        margin-right: 8px;
      }

      @media (max-width: 640px) {
        .results {
          grid-template-columns: 1fr;
        }
        select {
          min-width: 100%;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        #drop {
          transition:
            border-color 0.15s,
            color 0.15s;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Background Remover</h1>
      <p class="sub">
        To upload an image, remove the background, and download it as a PNG
      </p>

      <section class="panel">
        <div
          id="drop"
          tabindex="0"
          role="button"
          aria-label="Image choose karo"
        >
          <strong id="dropText">Drop an image here or click to browse</strong
          ><br />
          <small>PNG, JPG, WEBP &middot; max 10 MB</small>
        </div>
        <input type="file" id="file" accept="image/png,image/jpeg,image/webp" />

        <div class="row">
          <div>
            <label for="method"
              >You can remove a photo background using...</label
            >
            <select id="method">
              <option value="rembg">
                Python library (rembg) - free, local
              </option>
              <option
                value="removebg"
                {%
                if
                not
                has_removebg
                %}disabled{%
                endif
                %}
              >
                remove.bg API {% if not has_removebg %}(key missing){% endif %}
              </option>
              <option
                value="clipdrop"
                {%
                if
                not
                has_clipdrop
                %}disabled{%
                endif
                %}
              >
                ClipDrop API {% if not has_clipdrop %}(key missing){% endif %}
              </option>
            </select>
          </div>
          <button id="go" disabled>Remove background</button>
        </div>

        <div id="status" role="status" aria-live="polite"></div>

        <div class="results">
          <figure>
            <figcaption>Original</figcaption>
            <div class="frame" id="beforeFrame">
              <span class="empty">No Image Found</span>
            </div>
          </figure>
          <figure>
            <figcaption>Result</figcaption>
            <div class="frame checker" id="afterFrame">
              <span class="empty">Result Area..</span>
            </div>
          </figure>
        </div>

        <div id="actions">
          <a class="button" id="download" download="no-background.png"
            >Download PNG</a
          >
          <button class="secondary" id="reset" type="button">New image</button>
        </div>
      </section>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const drop = $("drop"),
        fileInput = $("file"),
        goBtn = $("go"),
        statusEl = $("status");
      let selectedFile = null;

      function setStatus(msg, isError = false) {
        statusEl.textContent = msg;
        statusEl.className = isError ? "error" : "";
      }

      function showImage(frame, src, alt) {
        frame.innerHTML = "";
        const img = document.createElement("img");
        img.src = src;
        img.alt = alt;
        frame.appendChild(img);
      }

      function pickFile(file) {
        if (!file) return;
        selectedFile = file;
        $("dropText").textContent = file.name;
        showImage(
          $("beforeFrame"),
          URL.createObjectURL(file),
          "Original image",
        );
        $("afterFrame").innerHTML =
          '<span class="empty">Here Result Show</span>';
        $("actions").style.display = "none";
        goBtn.disabled = false;
        setStatus("");
      }

      drop.addEventListener("click", () => fileInput.click());
      drop.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          fileInput.click();
        }
      });
      fileInput.addEventListener("change", () => pickFile(fileInput.files[0]));
      drop.addEventListener("dragover", (e) => {
        e.preventDefault();
        drop.classList.add("over");
      });
      drop.addEventListener("dragleave", () => drop.classList.remove("over"));
      drop.addEventListener("drop", (e) => {
        e.preventDefault();
        drop.classList.remove("over");
        pickFile(e.dataTransfer.files[0]);
      });

      goBtn.addEventListener("click", async () => {
        const form = new FormData();
        form.append("image", selectedFile);
        form.append("method", $("method").value);

        goBtn.disabled = true;
        setStatus(
          "Removing background... (The rembg model is downloading for the first time, so this may take a moment.)",
        );

        try {
          const res = await fetch("/remove", { method: "POST", body: form });
          if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            throw new Error(data.error || "Server error");
          }
          const url = URL.createObjectURL(await res.blob());
          showImage($("afterFrame"), url, "Background removed image");
          $("download").href = url;
          $("actions").style.display = "block";
          setStatus("Remove The Background of Image!");
        } catch (err) {
          setStatus(err.message, true);
        } finally {
          goBtn.disabled = false;
        }
      });

      $("reset").addEventListener("click", () => {
        selectedFile = null;
        fileInput.value = "";
        $("dropText").textContent = "Drop your image here or click to browse";
        $("beforeFrame").innerHTML =
          '<span class="empty">There is no image select right now</span>';
        $("afterFrame").innerHTML =
          '<span class="empty">Here Result Show.</span>';
        $("actions").style.display = "none";
        goBtn.disabled = true;
        setStatus("");
      });
    </script>
  </body>
</html>
